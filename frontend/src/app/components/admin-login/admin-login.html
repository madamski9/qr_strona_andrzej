<div class="admin-login-container">
  <div class="admin-login-card">
    <div class="card-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M17 11l1.5 1.5L21 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>Panel admina</h1>
    <p class="subtitle">Wpisz hasło, aby uzyskać dostęp</p>

    <form (ngSubmit)="submitPassword()">
      <div class="form-group">
        <label for="password">Hasło</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Wpisz hasło"
          class="input-field"
          [disabled]="isLoading"
          (keyup.enter)="submitPassword()"
          autocomplete="current-password"
        />
      </div>

      <button
        type="submit"
        class="btn-submit"
        [disabled]="!password || isLoading"
      >
        {{ isLoading ? 'Sprawdzanie...' : 'Wejdź do panelu' }}
      </button>
    </form>

    <button type="button" class="btn-back" (click)="goBack()" [disabled]="isLoading">
      ← Wróć
    </button>

    @if (errorMessage) {
      <div class="error-message">{{ errorMessage }}</div>
    }
  </div>
</div>
