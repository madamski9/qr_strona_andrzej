<div class="landing-container">
  <div class="landing-card">
    <h1>Strona QR</h1>
    <p class="subtitle">Wpisz swój nick aby kontynuować</p>

    <form (ngSubmit)="submitNick()">
      <div class="form-group">
        <label for="nick">Twój Nick:</label>
        <input
          type="text"
          id="nick"
          [(ngModel)]="nick"
          name="nick"
          placeholder="np. Tomek"
          class="input-field"
          [disabled]="isLoading"
        />
      </div>

      <button
        type="submit"
        class="btn-submit"
        [disabled]="!nick || isLoading"
      >
        {{ isLoading ? 'Ładowanie...' : 'Wejdź' }}
      </button>
    </form>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <div class="admin-row">
      <button type="button" (click)="goToAdmin()" class="admin-link">Panel administratora</button>
    </div>
  </div>
</div>
