<div class="response-container">
  <div class="response-card">
    <h1>{{ currentQuestion }}</h1>

    <form (ngSubmit)="submitResponse()">
      <div class="form-group">
        <textarea
          [(ngModel)]="responseText"
          name="response"
          placeholder="Wpisz swoją odpowiedź tutaj..."
          class="textarea-field"
          [disabled]="isSubmitting"
          rows="6"
        ></textarea>
      </div>

      <button
        type="submit"
        class="submit-btn"
        [disabled]="isSubmitting || !responseText.trim()"
      >
        {{ isSubmitting ? 'Wysyłanie...' : 'Wyślij odpowiedź' }}
      </button>
    </form>

    @if (error) {
      <div class="error-message">{{ error }}</div>
    }

    @if (userResponses.length > 0) {
      <div class="responses-section">
        <h2>Twoje odpowiedzi</h2>
        <div class="responses-list">
          @for (resp of userResponses; track resp.createdAt) {
            <div class="response-item">
              <p>{{ resp.response }}</p>
              <small>{{ resp.createdAt | date: 'short' }}</small>
            </div>
          }
        </div>
      </div>
    }

    @if (isLoading) {
      <div class="loading">Ładowanie...</div>
    }
  </div>
</div>
