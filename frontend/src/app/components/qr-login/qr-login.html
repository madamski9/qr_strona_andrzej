<div class="login-container">
  <div class="login-card">
    <h1>Witaj!</h1>
    <p class="subtitle">Wpisz swój nick, aby kontynuować</p>

    <form (ngSubmit)="submitNickname()">
      <div class="form-group">
        <input
          type="text"
          [(ngModel)]="nickname"
          name="nickname"
          placeholder="Wpisz swój nick"
          class="input-field"
          [disabled]="isLoading"
        />
      </div>

      <button
        type="submit"
        class="submit-btn"
        [disabled]="isLoading || !nickname.trim()"
      >
        {{ isLoading ? 'Ładowanie...' : 'Dalej' }}
      </button>
    </form>

    <div *ngIf="error" class="error-message">
      {{ error }}
    </div>
  </div>
</div>
